<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ScenePilot</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

    <main class="container">

        <p class="eyebrow">
            AI FILM PRODUCTION INTELLIGENCE
        </p>

        <h1>
            ScenePilot
        </h1>

        <p class="description">
            Turn a screenplay into a
            research-backed production plan.
        </p>

        <div class="card">

            <h2>
                Start a production analysis
            </h2>

            <p>
                Upload a screenplay PDF to begin.
            </p>

            <form
                action="/analysis/upload"
                method="post"
                enctype="multipart/form-data"
            >

                <input
                    type="file"
                    name="file"
                    accept=".pdf"
                    required
                >

                <button type="submit">
                    Analyze Screenplay
                </button>

            </form>

        </div>

    </main>

</body>

</html>
